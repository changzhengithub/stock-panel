[project]
name = "stock-panel-api"
version = "0.1.0"
description = "Personal A-share market browser"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "akshare>=1.18,<2",
    "pypinyin>=0.53,<1",
    "pytdxdata==0.4.0",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.16.10",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
